function pageA2Editor(){
 const ja='<h1 class="page-title">校報編集室</h1><div class="notice">1989年3月10日。校報第12号の入稿まで、あと2日。</div><p>私は藤宮詩織。校報部の部員。今、学校の推薦枠をめぐる不正を追っている。</p><p>教頭の葛城修が、業者と結託して推薦枠を売っていた。証拠は旧図書室の書庫にある。</p><p>3月12日、私は葛城を旧図書室で問い詰める。その日、すべてをサーバにアップロードするつもりだ。</p><p class="tiny">※左の取材ファイルを順に確認してください。</p>';
 const zh='<h1>校报编辑室</h1><div class="notice">1989年3月10日。校报第12号截稿还有2天。</div><p>我是藤宫诗织，校报部成员。现在正在追查学校推荐名额的不正行为。</p><p>教头葛城修与业者勾结，出卖推荐名额。证据在旧图书室的书库里。</p><p>3月12日，我会在旧图书室质问他。那一天，我准备把所有资料上传到服务器。</p><p class="tiny">※请依次查看左侧的取材文件。</p>';
 return siteShell2(ja,zh,'a2_editor');
}

function initBoard(){
 const board=document.getElementById('memoBoard');if(!board)return;
 board.addEventListener('dragover',function(e){e.preventDefault();});
 board.addEventListener('drop',function(e){
  e.preventDefault();const raw=e.dataTransfer.getData('text/plain');if(!raw)return;let data;try{data=JSON.parse(raw);}catch(err){return;}
  const rect=board.getBoundingClientRect();const x=Math.max(8,Math.min(92,((e.clientX-rect.left)/rect.width)*100));const y=Math.max(8,Math.min(92,((e.clientY-rect.top)/rect.height)*100));
  if(data.type==='clue'){state.nodes.push({uid:'n_'+Date.now()+Math.random().toString(36).slice(2,6),clueId:data.clueId,x:x,y:y});render();}
  else if(data.type==='node'){const n=state.nodes.find(function(n){return n.uid===data.uid;});if(n){n.x=x;n.y=y;render();}}
 });
 document.querySelectorAll('.clue-card').forEach(function(chip){chip.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',JSON.stringify({type:'clue',clueId:chip.dataset.clue}));e.dataTransfer.effectAllowed='copy';});});
 document.querySelectorAll('.memo-node').forEach(function(node){node.addEventListener('dragstart',function(e){e.stopPropagation();e.dataTransfer.setData('text/plain',JSON.stringify({type:'node',uid:node.dataset.uid}));e.dataTransfer.effectAllowed='move';});node.addEventListener('dragover',function(e){e.preventDefault();e.stopPropagation();});node.addEventListener('drop',function(e){e.preventDefault();e.stopPropagation();const raw=e.dataTransfer.getData('text/plain');if(!raw)return;let data;try{data=JSON.parse(raw);}catch(err){return;}if(data.type==='node'&&data.uid!==node.dataset.uid)tryCombine(data.uid,node.dataset.uid);});});
}
function tryCombine(uidA,uidB){
 const a=state.nodes.find(function(n){return n.uid===uidA;});const b=state.nodes.find(function(n){return n.uid===uidB;});if(!a||!b)return;
 const rec=RECIPES.find(function(r){return (r.a===a.clueId&&r.b===b.clueId)||(r.a===b.clueId&&r.b===a.clueId);});
 if(!rec){showToast('二つの証拠は結びつかない。');return;}
 if(state.nodes.some(function(n){return n.clueId===rec.result;})){showToast('その推理はすでにボードにあります。');return;}
 const x=(a.x+b.x)/2,y=(a.y+b.y)/2;state.nodes=state.nodes.filter(function(n){return n.uid!==uidA&&n.uid!==uidB;});state.nodes.push({uid:'n_'+Date.now()+Math.random().toString(36).slice(2,6),clueId:rec.result,x:x,y:y});
 if(!has(rec.result))addEvidence(rec.result);
 render();showToast('新しい推理：'+CLUES[rec.result].name);
}

function nav(page){

function handleAct(act,el){

  case 'loginTeacher':loginTeacher();break;
  case 'logoutA1':logoutA1();break;
  case 'openA1Doc':openA1Doc(el.dataset.doc);break;
